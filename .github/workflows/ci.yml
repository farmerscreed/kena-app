name: CI

on:
  pull_request:
    # D13 §13.5 — every d13/pr-N branch merges into the integration
    # branch only when CI is green, so PRs into it must run CI too.
    branches: [main, 'redesign/**']
  push:
    branches: [main, 'redesign/**']

# Cancel in-progress runs for the same branch when a newer commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint --workspace=apps/mobile

      - name: Typecheck
        run: npm run typecheck --workspace=apps/mobile

      - name: Test
        run: npm run test --workspace=apps/mobile

      # D13 PR-3 — the docs/05 CI contract (step 5): every user-visible
      # string in the scanned tree passes the voice dictionary. Hard
      # fails block the merge; the deliberate-violation test in the
      # unit suite proves this step actually bites.
      - name: Copy lint (voice rules)
        run: npm run copy-lint --workspace=apps/mobile

      # D13 PR-1 — the edge functions carry Deno tests (classification,
      # baselines, templates, guards) that the npm graph never runs.
      # -A: internal-auth's tests read env to prove the fail-closed path.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge function tests (Deno)
        run: deno test -A supabase/functions/_shared/

      # Dependency security. Was a bare `npm audit --omit=dev
      # --audit-level=high`, which had failed on every run since
      # 2026-08-14 and so carried no information — a permanently red
      # check tells you nothing changed.
      #
      # The cause is that --omit=dev does not mean "what ships": Expo
      # declares its CLI, Metro and Babel as runtime dependencies, so
      # the build toolchain is audited as if it were in the APK.
      # audit-gate asks the question that was actually intended — can
      # this advisory reach the shipped app? — and blocks on anything
      # not recorded as unreachable in tools/audit-gate/allowlist.ts.
      # Suppressions carry a reason and expire.
      - name: Audit (dependency security gate)
        run: npm run audit-gate --workspace=apps/mobile
